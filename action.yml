name: 'Build dist branch'
description: 'Build npm package and push to dist branch'

inputs:
  prebuilt_dir:
    description: 'Path to pre-built output directory. When set, skips checkout/setup/build and only manages the dist branch.'
    required: false
    default: ''
  source_ref:
    description: 'Source ref to build from (defaults to repository default branch)'
    required: false
    default: ''
  node_version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  pnpm_version:
    description: 'pnpm version to use (only used if pnpm detected)'
    required: false
    default: '10'
  build_command:
    description: 'Build command to run (default: auto-detect from package manager)'
    required: false
    default: ''
  dist_branch:
    description: 'Name of dist branch. Slashes are allowed (e.g. "dist/treemap") for the namespaced dist/<pkg> convention; see the README.'
    required: false
    default: 'dist'
  build_dir:
    description: 'Directory created by build command (moved to root on dist branch)'
    required: false
    default: 'dist'
  preserve_dirs:
    description: 'Comma-separated list of directories to preserve as-is on the dist branch (e.g., "dist,types"). By default, build output is flattened to the root.'
    required: false
    default: ''
  source_dirs:
    description: 'Deprecated: use preserve_dirs instead.'
    required: false
    default: ''
  extra_files:
    description: 'Comma-separated list of additional files to include alongside build output (e.g., "src/styles.css,README.md")'
    required: false
    default: ''
  version_suffix:
    description: 'Add version suffix with git SHA (e.g., 0.1.0-dist.abc1234). Set to "false" to disable.'
    required: false
    default: 'true'
  pkg_include:
    description: 'Comma-separated list of package.json fields to include from source (default: name,description,keywords,repository,author,license,homepage,bugs,exports)'
    required: false
    default: ''
  pkg_exclude:
    description: 'Comma-separated list of package.json fields to exclude from merge (overrides include list)'
    required: false
    default: ''
  pkg_kvs:
    description: 'JSON object of key-value overrides for package.json (e.g., {"name":"custom-name"})'
    required: false
    default: ''
  exports_map:
    description: 'JSON mapping of source export values to dist export values (e.g., {"./lib/index.js":"./dist/plotly.min.js"}). Entries not in the map whose targets do not exist on the dist branch are dropped.'
    required: false
    default: ''
  pkgs:
    description: 'Monorepo mode: package paths, one per line. Uses pnpm pack to resolve workspace/catalog refs, preserves directory structure on dist branch.'
    required: false
    default: ''
  package_dir:
    description: 'Single-package mode for a monorepo subdir: the path to one package (e.g. "packages/react"), packed and flattened to the dist branch ROOT so a git dep resolves it directly (github:owner/repo#<sha> → that package). Mutually exclusive with pkgs.'
    required: false
    default: ''
  on_source_rewrite:
    description: 'How to choose the new dist commit''s first parent when the source ref was force-pushed. "rewrite" (default): walk back to the most recent dist commit whose source-parent is still an ancestor of the new source SHA, rebuild on top of it (dist ancestry mirrors source ancestry); errors if there is none. "preserve": always chain onto the current dist tip (may retain references to abandoned source commits). "error": fail if the dist tip''s source-parent is not an ancestor of the new source SHA. "fresh": start a new dist lineage (the source commit is the only parent; package.json regenerated as on a first build). A "NPM-Dist-On-Source-Rewrite: <mode>" trailer on the source commit overrides this, for one push.'
    required: false
    default: 'rewrite'
  old_dist_tag:
    description: 'When the new dist commit does not descend from the old dist tip (fresh, or rewrite walking back), tag the old tip so pinned SHAs stay reachable. Template: {branch} = dist branch, {sha} = 7-char SHA of the old tip''s source commit. "none" disables. A "NPM-Dist-Old-Dist-Tag: <template>" source-commit trailer overrides this.'
    required: false
    default: '{branch}-{sha}'

runs:
  using: 'composite'
  steps:
    - name: Checkout (standard mode)
      if: inputs.prebuilt_dir == ''
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.source_ref || github.event.repository.default_branch }}
        fetch-depth: 0

    - name: Get source info (prebuilt mode)
      if: inputs.prebuilt_dir != ''
      id: prebuilt_info
      shell: bash
      run: |
        echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        if [ -f "${{ inputs.prebuilt_dir }}/package.json" ]; then
          echo "pkg_name=$(jq -r .name '${{ inputs.prebuilt_dir }}/package.json')" >> $GITHUB_OUTPUT
        else
          echo "pkg_name=unknown" >> $GITHUB_OUTPUT
        fi
        echo "pm=pnpm" >> $GITHUB_OUTPUT  # default for install command output

    - name: Get package and source info (standard mode)
      if: inputs.prebuilt_dir == ''
      id: info
      shell: bash
      run: |
        echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "pkg_name=$(jq -r .name package.json)" >> $GITHUB_OUTPUT

        # Detect package manager from lock files
        if [ -f "pnpm-lock.yaml" ]; then
          echo "pm=pnpm" >> $GITHUB_OUTPUT
        elif [ -f "bun.lockb" ]; then
          echo "pm=bun" >> $GITHUB_OUTPUT
        elif [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        elif [ -f "package-lock.json" ]; then
          echo "pm=npm" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT  # fallback
        fi
        echo "Detected package manager: $(grep '^pm=' $GITHUB_OUTPUT | cut -d= -f2)"

        # Check if packageManager field exists (pnpm/action-setup will use it)
        if jq -e .packageManager package.json > /dev/null 2>&1; then
          echo "has_pkg_mgr=true" >> $GITHUB_OUTPUT
        else
          echo "has_pkg_mgr=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup pnpm (with version)
      if: inputs.prebuilt_dir == '' && steps.info.outputs.pm == 'pnpm' && steps.info.outputs.has_pkg_mgr != 'true'
      uses: pnpm/action-setup@v5
      with:
        version: ${{ inputs.pnpm_version }}

    - name: Setup pnpm (from packageManager)
      if: inputs.prebuilt_dir == '' && steps.info.outputs.pm == 'pnpm' && steps.info.outputs.has_pkg_mgr == 'true'
      uses: pnpm/action-setup@v5

    - name: Setup Node.js
      if: inputs.prebuilt_dir == ''
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ steps.info.outputs.pm }}

    - name: Install dependencies
      if: inputs.prebuilt_dir == ''
      shell: bash
      run: |
        case "${{ steps.info.outputs.pm }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          npm)  npm ci ;;
          yarn) yarn install --frozen-lockfile ;;
          bun)  bun install --frozen-lockfile ;;
        esac

    - name: Build
      if: inputs.prebuilt_dir == ''
      shell: bash
      run: |
        BUILD_CMD="${{ inputs.build_command }}"
        if [ -z "$BUILD_CMD" ]; then
          BUILD_CMD="${{ steps.info.outputs.pm }} run build"
        fi
        $BUILD_CMD

    - name: Commit to dist branch (standard mode)
      if: inputs.pkgs == '' && inputs.package_dir == ''
      shell: bash
      env:
        DIST_BRANCH: ${{ inputs.dist_branch || 'dist' }}
        BUILD_DIR: ${{ inputs.prebuilt_dir || inputs.build_dir }}
        PRESERVE_DIRS: ${{ inputs.preserve_dirs }}
        SOURCE_DIRS: ${{ inputs.source_dirs }}
        EXTRA_FILES: ${{ inputs.extra_files }}
        VERSION_SUFFIX: ${{ inputs.version_suffix }}
        PKG_INCLUDE: ${{ inputs.pkg_include }}
        PKG_EXCLUDE: ${{ inputs.pkg_exclude }}
        PKG_KVS: ${{ inputs.pkg_kvs }}
        EXPORTS_MAP: ${{ inputs.exports_map }}
        ON_SOURCE_REWRITE: ${{ inputs.on_source_rewrite }}
        OLD_DIST_TAG: ${{ inputs.old_dist_tag }}
      run: ${{ github.action_path }}/scripts/build-dist.sh ${{ steps.prebuilt_info.outputs.source_sha || steps.info.outputs.source_sha }}

    - name: Commit to dist branch (monorepo / package_dir mode)
      if: inputs.pkgs != '' || inputs.package_dir != ''
      shell: bash
      env:
        DIST_BRANCH: ${{ inputs.dist_branch || 'dist' }}
        PKGS: ${{ inputs.pkgs }}
        PACKAGE_DIR: ${{ inputs.package_dir }}
        VERSION_SUFFIX: ${{ inputs.version_suffix }}
        ON_SOURCE_REWRITE: ${{ inputs.on_source_rewrite }}
        OLD_DIST_TAG: ${{ inputs.old_dist_tag }}
      run: ${{ github.action_path }}/scripts/build-dist-monorepo.sh ${{ steps.prebuilt_info.outputs.source_sha || steps.info.outputs.source_sha }}

    - name: Get dist SHA
      id: dist
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Push dist branch
      shell: bash
      run: git push origin ${{ inputs.dist_branch || 'dist' }} --force-with-lease

    - name: Output dist branch info
      shell: bash
      env:
        PKGS: ${{ inputs.pkgs }}
      run: |
        PKG_NAME="${{ steps.prebuilt_info.outputs.pkg_name || steps.info.outputs.pkg_name }}"
        DIST_BRANCH="${{ inputs.dist_branch || 'dist' }}"
        DIST_SHA="${{ steps.dist.outputs.sha }}"
        SOURCE_SHA="${{ steps.prebuilt_info.outputs.source_sha || steps.info.outputs.source_sha }}"
        REPO="${{ github.repository }}"
        PM="${{ steps.prebuilt_info.outputs.pm || steps.info.outputs.pm }}"

        echo ""
        echo "=========================================="
        echo "✅ Dist branch updated successfully!"
        echo "=========================================="
        echo ""
        echo "🌿 Branch: ${DIST_BRANCH}"
        echo "🔗 Dist SHA: ${DIST_SHA}"
        echo "📝 Source SHA: ${SOURCE_SHA}"
        echo ""

        if [ -n "$PKGS" ]; then
          # Normalize: convert newlines to commas, strip empty entries
          PKGS=$(echo "$PKGS" | tr '\n' ',' | sed 's/,,*/,/g; s/^,//; s/,$//')
          echo "📦 Monorepo packages:"
          IFS=',' read -ra PKG_PATHS <<< "$PKGS"
          for pkg_path in "${PKG_PATHS[@]}"; do
            pkg_path=$(echo "$pkg_path" | xargs)
            pkg_name=$(jq -r .name "$pkg_path/package.json" 2>/dev/null || echo "$pkg_path")
            echo "  - $pkg_name"
          done
          echo ""
          echo "To use these packages (pnpm 9+ git subdirectory syntax):"
          for pkg_path in "${PKG_PATHS[@]}"; do
            pkg_path=$(echo "$pkg_path" | xargs)
            pkg_name=$(jq -r .name "$pkg_path/package.json" 2>/dev/null || echo "$pkg_path")
            echo "  \"$pkg_name\": \"git+https://github.com/${REPO}.git?path=/${pkg_path}#${DIST_SHA}\""
          done
          echo ""
          echo "::notice title=🌿 Dist Branch Updated::${DIST_BRANCH} @ ${DIST_SHA:0:7} (monorepo)"
        else
          echo "📦 Package: ${PKG_NAME}"
          echo ""
          echo "To use this version:"
          echo "  ${PM} add github:${REPO}#${DIST_SHA}"
          echo ""
          echo "::notice title=🌿 Dist Branch Updated::${DIST_BRANCH} @ ${DIST_SHA:0:7}"
          echo "::notice title=📦 Install Command::${PM} add github:${REPO}#${DIST_SHA}"
        fi
